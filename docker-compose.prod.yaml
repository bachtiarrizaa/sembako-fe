services:
  # ─── Frontend (Next.js) — PRODUCTION ────────────────────────────────────────
  sembako-fe:
    container_name: sembako-fe-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=${BACKEND_URL}
    restart: unless-stopped
