services:
  # ─── Frontend (Next.js) — STAGING ───────────────────────────────────────────
  sembako-fe:
    container_name: sembako-fe-staging
    build:
      context: .
      dockerfile: Dockerfile
      target: staging
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=${BACKEND_URL}
    restart: unless-stopped
