name: Deploy Staging (develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEV_DEPLOY_HOST }}" ]; then
            ssh-keyscan -H "${{ secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Deploy to Staging
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.DEV_DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }} << 'EOF'
            set -e
            echo "Deploying sembako-fe (staging)..."
            cd ~/sembako/sembako-fe-dev
            git checkout develop
            git pull origin develop
            docker compose down --remove-orphans
            docker compose up -d --build
            echo "Staging deployed successfully"
          EOF
